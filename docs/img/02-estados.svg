<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
  <title id="t">Cada equipo nombra sus estados a su manera</title>
  <desc id="d">Los estados del export se traducen a nueve estados comunes agrupados en pendiente, en curso, en espera y hecho. Los dudosos se confirman una vez.</desc>
  <style>
    .f{font-family:Ubuntu,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .h{font-size:20px;font-weight:700;fill:#121a38}
    .s{font-size:13px;fill:#5a6577}
    .c{font-size:12px;font-weight:700;fill:#5a6577;letter-spacing:.06em}
    .src{font-size:13px;fill:#121a38}
    .dst{font-size:13px;font-weight:700;fill:#0058ab}
    .et{font-size:14px;font-weight:700;fill:#121a38}
    .p{font-size:12px;fill:#5a6577}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0058ab"/>
    </marker>
    <marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b67c00"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="518" rx="14" fill="#ffffff" stroke="#e1e5ea"/>
  <text class="f h" x="32" y="44">Cada equipo nombra sus estados a su manera</text>
  <text class="f s" x="32" y="68">La página los traduce a nueve estados comunes. Así las cifras de todos los equipos significan lo mismo.</text>
  <text class="f s" x="32" y="86">Los que reconoce por el nombre van solos. Los dudosos los confirmas tú una vez.</text>

  <text class="f c" x="60" y="122">EN EL EXPORT</text>
  <text class="f c" x="600" y="122">ESTADOS COMUNES</text>

  <!-- estados de origen -->
  <g class="f src">
    <rect x="60" y="129" width="190" height="26" rx="13" fill="#f3f4f7" stroke="#e1e5ea"/><text x="76" y="147">To Do</text>
    <rect x="60" y="167" width="190" height="26" rx="13" fill="#f3f4f7" stroke="#e1e5ea"/><text x="76" y="185">Por hacer</text>
    <rect x="60" y="205" width="190" height="26" rx="13" fill="#f3f4f7" stroke="#e1e5ea"/><text x="76" y="223">In Dev</text>
    <rect x="60" y="243" width="190" height="26" rx="13" fill="#f3f4f7" stroke="#e1e5ea"/><text x="76" y="261">Desarrollo</text>
    <rect x="60" y="281" width="190" height="26" rx="13" fill="#f3f4f7" stroke="#e1e5ea"/><text x="76" y="299">Code Review</text>
    <rect x="60" y="319" width="190" height="26" rx="13" fill="#f3f4f7" stroke="#e1e5ea"/><text x="76" y="337">QA</text>
    <rect x="60" y="357" width="190" height="26" rx="13" fill="#fff3d6" stroke="#b67c00"/><text x="76" y="375">Pte. cliente</text>
    <rect x="60" y="395" width="190" height="26" rx="13" fill="#f3f4f7" stroke="#e1e5ea"/><text x="76" y="413">Resuelta</text>
    <rect x="60" y="433" width="190" height="26" rx="13" fill="#f3f4f7" stroke="#e1e5ea"/><text x="76" y="451">Won't Do</text>
  </g>

  <!-- flechas -->
  <g fill="none" stroke="#0058ab" stroke-width="1.8" marker-end="url(#a)">
    <path d="M254,142 C420,142 430,174 592,174"/>
    <path d="M254,180 C420,180 430,174 592,174"/>
    <path d="M254,218 C420,218 430,222 592,222"/>
    <path d="M254,256 C420,256 430,222 592,222"/>
    <path d="M254,294 C420,294 430,302 592,302"/>
    <path d="M254,332 C420,332 430,334 592,334"/>
    <path d="M254,408 C420,408 430,414 592,414"/>
    <path d="M254,446 C420,446 430,446 592,446"/>
  </g>
  <path d="M254,370 C420,370 430,366 592,366" fill="none" stroke="#b67c00" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#w)"/>
  <rect x="372" y="352" width="96" height="20" rx="10" fill="#fff3d6"/>
  <text class="f p" x="420" y="366" text-anchor="middle" style="fill:#b67c00;font-weight:700">por confirmar</text>

  <!-- estados comunes -->
  <g class="f dst">
    <rect x="600" y="129" width="150" height="26" rx="6" fill="#e6f0fa"/><text x="614" y="147">Nuevo</text>
    <rect x="600" y="161" width="150" height="26" rx="6" fill="#e6f0fa" stroke="#0058ab"/><text x="614" y="179">Pendiente</text>
    <rect x="600" y="209" width="150" height="26" rx="6" fill="#e6f0fa" stroke="#0058ab"/><text x="614" y="227">En curso</text>
    <rect x="600" y="257" width="150" height="26" rx="6" fill="#e6f0fa"/><text x="614" y="275">Bloqueado</text>
    <rect x="600" y="289" width="150" height="26" rx="6" fill="#e6f0fa" stroke="#0058ab"/><text x="614" y="307">Revisión</text>
    <rect x="600" y="321" width="150" height="26" rx="6" fill="#e6f0fa" stroke="#0058ab"/><text x="614" y="339">Pruebas</text>
    <rect x="600" y="353" width="150" height="26" rx="6" fill="#e6f0fa" stroke="#b67c00"/><text x="614" y="371">En espera</text>
    <rect x="600" y="401" width="150" height="26" rx="6" fill="#e6f0fa" stroke="#0058ab"/><text x="614" y="419">Terminado</text>
    <rect x="600" y="433" width="150" height="26" rx="6" fill="#e6f0fa" stroke="#0058ab"/><text x="614" y="451">Descartado</text>
  </g>

  <!-- etapas -->
  <g fill="none" stroke="#adb8c2" stroke-width="2">
    <path d="M766,131 h6 V185 h-6"/>
    <path d="M766,211 h6 V233 h-6"/>
    <path d="M766,259 h6 V377 h-6"/>
    <path d="M766,403 h6 V457 h-6"/>
  </g>
  <text class="f et" x="786" y="156">Pendiente</text>
  <text class="f p" x="786" y="173">Aún sin empezar</text>
  <text class="f et" x="786" y="220">En curso</text>
  <text class="f p" x="786" y="237">Alguien trabaja en ello</text>
  <text class="f et" x="786" y="310">En espera</text>
  <text class="f p" x="786" y="327">Parado esperando algo:</text>
  <text class="f p" x="786" y="343">un bloqueo, una revisión,</text>
  <text class="f p" x="786" y="359">pruebas o una respuesta</text>
  <text class="f et" x="786" y="424">Hecho</text>
  <text class="f p" x="786" y="441">Descartado no cuenta</text>
  <text class="f p" x="786" y="457">como entrega</text>

  <!-- leyenda -->
  <line x1="60" y1="492" x2="96" y2="492" stroke="#0058ab" stroke-width="2"/>
  <text class="f p" x="104" y="496">Se reconoce por el nombre</text>
  <line x1="290" y1="492" x2="326" y2="492" stroke="#b67c00" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="f p" x="334" y="496">Dudoso: lo confirmas tú en el paso Estados</text>
</svg>
