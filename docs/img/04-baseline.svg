<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d">
  <title id="t">Cada equipo se compara con su propia historia</title>
  <desc id="d">Gráfico de entregas por semana de un equipo de ejemplo. La franja de lo normal sale de sus doce semanas anteriores. Las cuatro últimas semanas caen por debajo de la franja.</desc>
  <style>
    .f{font-family:Ubuntu,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .h{font-size:20px;font-weight:700;fill:#121a38}
    .s{font-size:13px;fill:#5a6577}
    .c{font-size:12px;font-weight:700;fill:#5a6577;letter-spacing:.06em}
    .p{font-size:12px;fill:#5a6577}
    .ax{font-size:11px;fill:#adb8c2}
    .bt{font-size:14px;font-weight:700;fill:#121a38}
    .bx{font-size:12.5px;fill:#121a38}
  </style>
  <rect x="1" y="1" width="958" height="478" rx="14" fill="#ffffff" stroke="#e1e5ea"/>
  <text class="f h" x="32" y="44">Cada equipo se compara con su propia historia</text>
  <text class="f s" x="32" y="68">Lo normal de un equipo sale de sus semanas anteriores. Nunca se hace un ranking entre equipos.</text>

  <!-- cabeceras de zona -->
  <text class="f c" x="312" y="112" text-anchor="middle">BASELINE: 12 SEMANAS ANTERIORES</text>
  <text class="f c" x="622" y="112" text-anchor="middle" style="fill:#d9573d">AHORA: 4 ÚLTIMAS</text>

  <!-- rejilla -->
  <g stroke="#e1e5ea" stroke-width="1">
    <line x1="80" y1="283.6" x2="700" y2="283.6"/>
    <line x1="80" y1="187.1" x2="700" y2="187.1"/>
  </g>
  <line x1="80" y1="380" x2="700" y2="380" stroke="#adb8c2" stroke-width="1.5"/>
  <g class="f ax" text-anchor="end">
    <text x="72" y="384">0</text><text x="72" y="287.6">5</text><text x="72" y="191.1">10</text>
  </g>

  <!-- franja -->
  <rect x="80" y="161.1" width="465" height="45.3" fill="#1db8f2" opacity=".22"/>
  <rect x="545" y="161.1" width="155" height="45.3" fill="#1db8f2" opacity=".10" stroke="#1db8f2" stroke-dasharray="4 4"/>
  <rect x="96" y="312" width="16" height="12" fill="#1db8f2" opacity=".35"/>
  <text class="f p" x="120" y="322" style="fill:#0058ab;font-weight:700">Franja de lo normal: de 9 a 11,4 entregas</text>

  <!-- separador -->
  <line x1="545" y1="122" x2="545" y2="380" stroke="#5a6577" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- serie baseline -->
  <polyline fill="none" stroke="#121a38" stroke-width="2.2" stroke-linejoin="round"
    points="99.4,206.4 138.1,167.9 176.9,187.1 215.6,148.6 254.4,225.7 293.1,187.1 331.9,167.9 370.6,206.4 409.4,148.6 448.1,187.1 486.9,167.9 525.6,187.1"/>
  <g fill="#121a38">
    <circle cx="99.4" cy="206.4" r="3.5"/><circle cx="138.1" cy="167.9" r="3.5"/><circle cx="176.9" cy="187.1" r="3.5"/><circle cx="215.6" cy="148.6" r="3.5"/>
    <circle cx="254.4" cy="225.7" r="3.5"/><circle cx="293.1" cy="187.1" r="3.5"/><circle cx="331.9" cy="167.9" r="3.5"/><circle cx="370.6" cy="206.4" r="3.5"/>
    <circle cx="409.4" cy="148.6" r="3.5"/><circle cx="448.1" cy="187.1" r="3.5"/><circle cx="486.9" cy="167.9" r="3.5"/><circle cx="525.6" cy="187.1" r="3.5"/>
  </g>
  <!-- serie actual -->
  <polyline fill="none" stroke="#adb8c2" stroke-width="2" stroke-dasharray="3 3" points="525.6,187.1 564.4,206.4"/>
  <polyline fill="none" stroke="#d9573d" stroke-width="2.6" stroke-linejoin="round" points="564.4,206.4 603.1,245 641.9,264.3 680.6,264.3"/>
  <g fill="#d9573d">
    <circle cx="564.4" cy="206.4" r="4"/><circle cx="603.1" cy="245" r="4"/><circle cx="641.9" cy="264.3" r="4"/><circle cx="680.6" cy="264.3" r="4"/>
  </g>
  <line x1="550" y1="245" x2="700" y2="245" stroke="#d9573d" stroke-width="1.2" stroke-dasharray="2 3"/>
  <rect x="566" y="300" width="128" height="40" rx="8" fill="#ffe9e4"/>
  <text class="f p" x="630" y="316" text-anchor="middle" style="fill:#d9573d;font-weight:700">Media: 7 entregas</text>
  <text class="f p" x="630" y="332" text-anchor="middle" style="fill:#d9573d">fuera de lo normal</text>

  <text class="f p" x="80" y="402">Entregas por semana de un equipo de ejemplo. El eje empieza en cero.</text>

  <!-- explicación -->
  <rect x="728" y="96" width="204" height="100" rx="10" fill="#f3f4f7"/>
  <text class="f bt" x="744" y="120">La franja</text>
  <text class="f bx" x="744" y="142">Va del percentil 15 al 85</text>
  <text class="f bx" x="744" y="159">de sus 12 semanas previas.</text>
  <text class="f bx" x="744" y="176">Es lo que el equipo suele hacer.</text>

  <rect x="728" y="208" width="204" height="100" rx="10" fill="#f3f4f7"/>
  <text class="f bt" x="744" y="232">Ahora</text>
  <text class="f bx" x="744" y="254">La media de las 4 últimas</text>
  <text class="f bx" x="744" y="271">semanas, comparada con</text>
  <text class="f bx" x="744" y="288">la franja.</text>

  <rect x="728" y="320" width="204" height="100" rx="10" fill="#f3f4f7"/>
  <text class="f bt" x="744" y="344">Cuándo vale</text>
  <text class="f bx" x="744" y="366">Con 6 a 11 semanas, la</text>
  <text class="f bx" x="744" y="383">baseline es provisional.</text>
  <text class="f bx" x="744" y="400">Con 12, está establecida.</text>

  <!-- leyenda -->
  <g class="f p">
    <circle cx="88" cy="446" r="6" fill="#0a9e9b"/><text x="100" y="450">Dentro de lo normal</text>
    <circle cx="242" cy="446" r="6" fill="#ffffff" stroke="#0a9e9b" stroke-width="2"/><text x="254" y="450">Mejor de lo normal</text>
    <circle cx="390" cy="446" r="6" fill="#b67c00"/><text x="402" y="450">Atención</text>
    <circle cx="474" cy="446" r="6" fill="#d9573d"/><text x="486" y="450">Fuera de lo normal</text>
    <circle cx="618" cy="446" r="6" fill="#adb8c2"/><text x="630" y="450">Revisar el dato</text>
  </g>
</svg>
