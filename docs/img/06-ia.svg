<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">La IA solo ve cifras agregadas y cada cifra se comprueba</title>
  <desc id="d">Las tareas se quedan en el navegador. Al modelo de IA solo le llega el paquete de diagnóstico con cifras por equipo. Su respuesta se valida cifra a cifra y lo que no cuadra no se enseña.</desc>
  <style>
    .f{font-family:Ubuntu,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .h{font-size:20px;font-weight:700;fill:#121a38}
    .s{font-size:13px;fill:#5a6577}
    .p{font-size:12px;fill:#5a6577}
    .bt{font-size:14px;font-weight:700;fill:#121a38}
    .bx{font-size:12.5px;fill:#121a38}
    .ch{font-size:12px;font-weight:700}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0058ab"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="438" rx="14" fill="#ffffff" stroke="#e1e5ea"/>
  <text class="f h" x="32" y="44">La IA solo ve cifras agregadas, y cada cifra se comprueba</text>
  <text class="f s" x="32" y="68">Es opcional. Sin clave, la página funciona igual con su banco de recomendaciones.</text>

  <rect x="24" y="92" width="600" height="316" rx="14" fill="#f3f4f7" stroke="#adb8c2" stroke-dasharray="6 5"/>
  <text class="f p" x="40" y="114">Tu navegador</text>

  <!-- tareas -->
  <rect x="48" y="132" width="236" height="112" rx="10" fill="#ffffff" stroke="#e1e5ea"/>
  <g transform="translate(72,160)" fill="none" stroke="#5a6577" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-8" y="-2" width="16" height="13" rx="2"/><path d="M-5,-2 v-4 a5,5 0 0 1 10,0 v4"/>
  </g>
  <text class="f bt" x="92" y="166">Tareas del export</text>
  <text class="f bx" x="64" y="194">Títulos, claves y fechas.</text>
  <text class="f bx" x="64" y="212">Se quedan aquí, nunca salen.</text>

  <!-- paquete -->
  <rect x="352" y="132" width="248" height="112" rx="10" fill="#ffffff" stroke="#0058ab" stroke-width="1.5"/>
  <text class="f bt" x="368" y="160">Paquete de diagnóstico</text>
  <text class="f bx" x="368" y="186">Cifras por equipo y del área.</text>
  <text class="f bx" x="368" y="204">Sin títulos, sin claves</text>
  <text class="f bx" x="368" y="222">y sin personas.</text>

  <line x1="288" y1="188" x2="344" y2="188" stroke="#0058ab" stroke-width="2" marker-end="url(#a)"/>
  <text class="f p" x="316" y="180" text-anchor="middle">resume</text>

  <!-- validación -->
  <rect x="352" y="272" width="248" height="120" rx="10" fill="#ffffff" stroke="#0058ab" stroke-width="1.5"/>
  <text class="f bt" x="368" y="298">Validación</text>
  <text class="f bx" x="368" y="320">Cada cifra de la respuesta</text>
  <text class="f bx" x="368" y="338">se busca en el paquete.</text>
  <g class="f ch">
    <rect x="368" y="354" width="104" height="24" rx="12" fill="#e0f8f7"/><text x="420" y="370" text-anchor="middle" style="fill:#0a9e9b">Cuadra: se ve</text>
    <rect x="480" y="354" width="110" height="24" rx="12" fill="#ffe9e4"/><text x="535" y="370" text-anchor="middle" style="fill:#d9573d">No cuadra: fuera</text>
  </g>

  <!-- modelo -->
  <rect x="712" y="172" width="216" height="128" rx="10" fill="#e6f0fa" stroke="#0058ab" stroke-width="1.5"/>
  <g transform="translate(736,200)" fill="#0058ab">
    <path d="M0,-10 L3,-3 L10,0 L3,3 L0,10 L-3,3 L-10,0 L-3,-3 z"/>
  </g>
  <text class="f bt" x="756" y="205">Modelo de IA</text>
  <text class="f bx" x="728" y="232">Claude por defecto.</text>
  <text class="f bx" x="728" y="250">Responde con texto y con</text>
  <text class="f bx" x="728" y="268">la lista de cifras que usa.</text>

  <path d="M604,196 H704" fill="none" stroke="#0058ab" stroke-width="2" marker-end="url(#a)"/>
  <text class="f p" x="654" y="188" text-anchor="middle">solo el paquete</text>
  <path d="M760,304 V332 H608" fill="none" stroke="#0058ab" stroke-width="2" marker-end="url(#a)"/>
  <text class="f p" x="684" y="324" text-anchor="middle">respuesta</text>

  <text class="f p" x="48" y="292">La clave de IA se escribe en Ajustes</text>
  <text class="f p" x="48" y="308">y se guarda solo en la sesión</text>
  <text class="f p" x="48" y="324">del navegador. Nunca en ficheros</text>
  <text class="f p" x="48" y="340">ni en exportaciones.</text>
</svg>
